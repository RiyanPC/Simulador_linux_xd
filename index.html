<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Comandos Linux - Laboratorio Interactivo</title>
  <meta name="description" content="Simulador interactivo y visual de comandos básicos y avanzados de Linux. Aprende terminal GNU/Bash con sistema de archivos en tiempo real y misiones guiadas.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-tokyo">
  <div class="app-container">
    <!-- Top Desktop Environment Panel -->
    <header class="top-panel" id="topPanel">
      <div class="panel-left">
        <div class="distro-brand">
          <!-- Arch Linux SVG Icon -->
          <svg class="distro-logo" viewBox="0 0 300 300" fill="currentColor">
            <path d="M141.2 24.5c-4.4 10.8-9.4 22.8-15 36.1-4.7 11.2-18.4 43.1-30.5 70.8s-22.3 51.9-22.8 53.6c-.7 2.6-.7 3.3.3 3.6 1.1.4 3.7-2.7 13.9-16.7 17.5-24 23.3-31 29.4-35.1 11.8-7.9 27-6.2 38.2 4.1 6.3 5.9 12.2 14.1 27.5 38.6 12 19.3 14 22 16.3 22.3 1.9.2 2.8-.7 5.7-5.5 1.8-3.1 7.2-15.5 12-27.6s18.8-43.2 31.1-69.1c12.2-25.9 22.4-47.5 22.6-48 .7-1.3-.2-1.9-5.4-3.5-9.4-2.8-21.7-8.8-28.7-13.8-6.1-4.4-7.5-4.8-13.4-3.7-14.7 2.8-31.5-2.2-46.7-14-3.9-3.1-7.7-4.1-34.6 8z"/>
          </svg>
          <span>Arch Linux</span>
          <span class="distro-badge">Live Lab</span>
        </div>

        <div class="workspaces-pill">
          <button class="ws-btn active" title="Espacio de Trabajo 1">1</button>
          <button class="ws-btn" title="Espacio de Trabajo 2">2</button>
          <button class="ws-btn" title="Espacio de Trabajo 3">3</button>
        </div>
      </div>

      <div class="panel-center">
        <div class="panel-title">
          <span class="live-indicator"></span>
          <span>bash 5.2 — usuario@arch-simulator</span>
        </div>
      </div>

      <div class="panel-right">
        <!-- Live System Metric Pills -->
        <div class="system-pill" title="Uso dinámico de CPU">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14h-2v-4H6V9h4V5h2v4h4v4h-4v4z"/></svg>
          <span>CPU:</span>
          <span id="cpuPercent">18%</span>
        </div>

        <div class="system-pill" title="Memoria RAM en uso">
          <span>RAM:</span>
          <span>4.9G / 16G</span>
        </div>

        <div class="system-pill" id="liveClock" title="Hora del sistema">
          --:--:--
        </div>

        <!-- Sound Synthesizer Toggle -->
        <button class="action-btn active" id="soundToggleBtn" title="Activar/Desactivar sonido mecánico">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <span>Sonido: ON</span>
        </button>

        <!-- Theme Selector -->
        <select class="theme-dropdown" id="themeSelect" title="Cambiar tema visual">
          <option value="tokyo">Tokyo Night</option>
          <option value="catppuccin">Catppuccin Mocha</option>
          <option value="matrix">Cyberpunk Matrix</option>
          <option value="nord">Nordic Dark</option>
        </select>

        <!-- Reset Button -->
        <button class="action-btn" id="resetFsBtn" title="Restaurar sistema de archivos a estado original">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          <span>Reiniciar VFS</span>
        </button>
      </div>
    </header>

    <!-- Workspace Split -->
    <main class="workspace-layout">
      <!-- Left: Interactive Terminal -->
      <section class="terminal-window" id="terminalWindow">
        <div class="window-header">
          <div class="window-controls">
            <button class="ctrl-btn close" title="Cerrar"></button>
            <button class="ctrl-btn minimize" title="Minimizar"></button>
            <button class="ctrl-btn maximize" title="Maximizar"></button>
          </div>

          <div class="window-tabs">
            <div class="window-tab">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8h16v10z"/></svg>
              <span>terminal — bash</span>
            </div>
          </div>

          <div class="window-meta">
            <span>xterm-256color • UTF-8</span>
          </div>
        </div>

        <div id="terminalContainer" style="flex: 1; display: flex; flex-direction: column; min-height: 0;"></div>
      </section>

      <!-- Right: Companion Panel with Tabs -->
      <aside class="sidebar-panel">
        <nav class="sidebar-tabs">
          <button class="sidebar-tab-btn active" data-tab="tabExplorer">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
            <span>Archivos (GUI)</span>
          </button>
          <button class="sidebar-tab-btn" data-tab="tabMissions">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <span>Misiones & Retos</span>
          </button>
          <button class="sidebar-tab-btn" data-tab="tabCheatsheet">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
            <span>Comandos (Cheat)</span>
          </button>
        </nav>

        <div class="tab-content-area">
          <!-- Tab 1: Live File Explorer -->
          <div class="tab-panel active" id="tabExplorer">
            <div class="explorer-header">
              <div class="breadcrumbs-bar" id="fsBreadcrumbs">
                <!-- Injected dynamically -->
              </div>
              <span class="path-badge" id="currentPathBadge">/home/usuario</span>
            </div>

            <div class="explorer-list" id="fileExplorerList">
              <!-- Injected dynamically -->
            </div>
          </div>

          <!-- Tab 2: Gamified Learning Missions -->
          <div class="tab-panel" id="tabMissions">
            <!-- Active Mission Card -->
            <div class="active-mission-card">
              <div class="mission-card-top">
                <span class="mission-badge" id="missionStepBadge">Paso 1 de 7</span>
                <span class="mission-xp-counter" id="missionXp">0 XP</span>
              </div>
              <h3 id="missionTitle">Cargando misión...</h3>
              <p class="mission-card-desc" id="missionDesc">...</p>
              <div class="mission-task-box">
                <b>Objetivo:</b> <span id="missionInstruction">...</span>
              </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
              <div class="progress-header">
                <span>Progreso del Laboratorio</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill" id="missionProgressBar"></div>
              </div>
            </div>

            <!-- All Missions List -->
            <div class="all-missions-section">
              <span class="section-label">Todos los niveles</span>
              <div id="allMissionsList" style="display: flex; flex-direction: column; gap: 6px;"></div>
            </div>
          </div>

          <!-- Tab 3: Searchable Cheatsheet -->
          <div class="tab-panel" id="tabCheatsheet">
            <div class="cheatsheet-search-wrapper">
              <input type="text" class="search-input" id="cheatsheetSearch" placeholder="Buscar comando o acción (ej: copiar, grep, permiso)..." />
            </div>
            <div class="cheatsheet-grid" id="cheatsheetGrid">
              <!-- Injected dynamically -->
            </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <!-- Interactive Nano Text Editor Modal -->
  <div class="nano-modal-backdrop" id="nanoModal">
    <div class="nano-window">
      <div class="nano-topbar">
        <span>GNU nano 7.2</span>
        <span id="nanoFileName">archivo.txt</span>
        <span>Modificado</span>
      </div>
      <div class="nano-body">
        <textarea class="nano-textarea" id="nanoContent" placeholder="Escribe aquí el contenido del archivo..."></textarea>
      </div>
      <div class="nano-bottombar">
        <div class="nano-shortcuts">
          <span><b>^O</b> Guardar</span>
          <span><b>^X</b> Salir</span>
        </div>
        <div class="nano-actions">
          <button class="nano-btn close" id="nanoCloseBtn">Cerrar</button>
          <button class="nano-btn save" id="nanoSaveBtn">Guardar Archivo</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/fs.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
